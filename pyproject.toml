[project]
name = "cosmos-agentic-retriever"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "anyio>=4,<5",
  "azure-identity>=1.17,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.10,<2",
  "openai>=1.109,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "structlog>=24,<27",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
benchmark = [
  "azure-cosmos>=4.7,<5",
  "huggingface_hub>=0.24,<2",
  "markitdown[pptx]>=0.1.2,<0.2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyarrow>=18,<27",
  # Bundles the pandoc binary that Harvey LAB uses to read .docx files.
  "pypandoc_binary>=1.15,<2",
  "tiktoken>=0.7,<1",
]
dev = [
  "azure-core>=1.30,<2",
  "azure-cosmos>=4.7,<5",
  "mypy>=2.4,<3",
  "pytest>=8,<9",
  "types-PyYAML>=6,<7",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_agentic_retriever"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["tests/live"]
markers = ["cosmos_live: read-only integration tests against prepared Cosmos fixtures"]
