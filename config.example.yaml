# OpenAI-compatible chat model.
llm_base_url: https://YOUR-ENDPOINT/openai/v1
llm_model: YOUR-MODEL
# Extra options sent with each model call, such as {temperature: 0}.
llm_params: {}
# Retries after the initial model request; the SDK handles backoff and jitter.
llm_max_retries: 6
# Agent turns per question. A request's maxTurns may go below the soft limit,
# and above it only up to the hard limit (default: the soft limit).
agent_turns_soft_limit: 10
agent_turns_hard_limit: 10
# Documents returned per question (up to 50), with the same rule for maxDocuments.
agent_documents_soft_limit: 20
agent_documents_hard_limit: 20
# Documents returned: "cited" (only those the answer cites), or "cited_and_ranked"
# (cited and then the best-ranked retrieved documents the answer didn't cite).
returned_documents: cited

# The deploy script sets TOOLKIT_APP_ID; local runs must supply it explicitly.
toolkit_mcp_url: http://127.0.0.1:8080/mcp

# How toolkit results are trimmed before the agent reads them. Search results
# shorten text values to this many characters (the agent can ask for full text).
tool_result_text_limit: 512
# Lists of at least this many numbers are treated as embeddings and left out.
tool_result_min_vector_dim: 128
# Fields left out of every result: by default, Cosmos DB's internal system fields.
tool_result_dropped_fields: [_rid, _self, _etag, _attachments]
